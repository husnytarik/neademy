name: Mobil Android derle

# Elle tetiklenir (Actions > Mobil Android derle > Run workflow).
# Çıktı: imzalı APK (telefona doğrudan kurulur) ve AAB (Google Play'e yüklenir), Actions > Artifacts altında.
on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobil
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true

      - name: Paketler, analiz, testler
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 sırrı tanımlı değil"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASS"
            echo "keyPassword=$KEYSTORE_PASS"
            echo "keyAlias=upload"
            echo "storeFile=app/upload-keystore.jks"
          } > android/key.properties

      - name: APK ve AAB derle
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} --dart-define=API=https://app.neademy.com
          flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=API=https://app.neademy.com

      - uses: actions/upload-artifact@v4
        with:
          name: neademy-android
          path: |
            mobil/build/app/outputs/flutter-apk/app-release.apk
            mobil/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
