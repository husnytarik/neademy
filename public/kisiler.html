<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>neademy - Kişiler</title>
  <link rel="stylesheet" href="/style.css?v=103">
  <script src="/renk.js?v=10"></script>
  <script src="/tema.js?v=1"></script>
</head>
<body>
  <header class="bant alt-bant">
    <a href="/panel" class="bant-geri" aria-label="Panele dön">&larr;</a>
    <h1>Kişiler</h1>
  </header>
  <main class="kart panel genis">
    <div class="sekmeler" id="sekmeler" role="group" aria-label="Kişi türü">
      <button type="button" data-sekme="personel" aria-pressed="true">Personel</button>
      <button type="button" data-git="/ogrenciler" aria-pressed="false">Öğrenciler</button>
      <button type="button" data-git="/kullanicilar" aria-pressed="false">Roller</button>
    </div>
    <p id="mesaj" class="mesaj" role="status" aria-live="polite"></p>

    <section class="ders-panel kad-panel">
      <div class="ekle-ust">
        <h3 class="baslik3">Personel</h3>
        <div class="kad-eylem">
          <button type="button" id="yazdir" class="ekle-ac"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V3h10v6"/><rect x="4" y="9" width="16" height="8" rx="1.5"/><path d="M7 14h10v7H7z"/></svg><span>Yazdır</span></button>
          <button type="button" id="yeni" class="ekle-ac kad-dolu"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Yeni kişi</span></button>
        </div>
      </div>
      <h2 id="yazdir-baslik" class="yazdir-baslik"></h2>
      <div class="ol-arac kz-arac" id="arac">
        <input id="ara" type="search" placeholder="Ad ile ara" aria-label="Kişi ara">
        <select id="f-okul" aria-label="Okula göre süz"></select>
        <select id="f-gorev" aria-label="Göreve göre süz">
          <option value="">Tüm görevler</option>
          <option value="ogretmen">Öğretmenler</option>
          <option value="yonetim">Yönetim</option>
          <option value="mudur">Müdür ve yardımcıları</option>
        </select>
        <select id="f-durum" aria-label="Duruma göre süz">
          <option value="aktif">Çalışanlar</option>
          <option value="pasif">Ayrılanlar</option>
          <option value="">Hepsi</option>
        </select>
      </div>
      <div id="yeni-alan" class="ekle-form gizli"></div>
      <div id="liste"></div>
      <p class="alt kad-alt"><span id="sayi"></span></p>
    </section>
    <div id="rapor" class="pr-rapor"></div>
  </main>
  <script src="/avatar.js?v=11"></script>
  <script src="/kisiler.js?v=5"></script>
  <script src="/bant.js?v=10"></script>
</body>
</html>
