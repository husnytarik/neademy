<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>neademy - Öğrenciler</title>
  <link rel="stylesheet" href="/style.css?v=23">
  <script src="/renk.js?v=10"></script>
</head>
<body>
  <header class="bant alt-bant">
    <a href="/panel" class="bant-geri" aria-label="Panele dön">&larr;</a>
    <h1>Öğrenciler</h1>
  </header>
  <main class="kart panel genis">
    <div class="sekmeler" id="sekmeler" role="group" aria-label="Kişi türü">
      <button type="button" data-git="/kisiler" aria-pressed="false">Personel</button>
      <button type="button" data-sekme="ogrenci" aria-pressed="true">Öğrenciler</button>
      <button type="button" data-git="/kullanicilar" aria-pressed="false">Roller</button>
    </div>
    <p id="mesaj" class="mesaj" role="status" aria-live="polite"></p>
    <section class="ders-panel">
      <div class="ekle-ust">
        <h3 class="baslik3" id="sayi">Öğrenciler</h3>
        <a class="ekle-ac" href="/ogrenci-kayit">+ Yeni öğrenci</a>
        <a class="ekle-ac gizli" id="karne-ac" href="#">Sınıf karneleri</a>
      </div>
      <div class="ol-arac">
        <input id="ara" type="search" placeholder="Ad ya da okul numarasıyla ara" aria-label="Öğrenci ara">
        <select id="okul" aria-label="Okula göre süz"></select>
        <select id="sinif" aria-label="Sınıfa göre süz"></select>
        <select id="durum" aria-label="Duruma göre süz">
          <option value="aktif">Okuyanlar</option>
          <option value="pasif">Ayrılanlar</option>
          <option value="">Tümü</option>
        </select>
      </div>
      <div id="liste"></div>
    </section>
  </main>
  <script src="/grafik.js?v=10"></script>
  <script src="/avatar.js?v=10"></script>
  <script src="/ogrenciler.js?v=11"></script>
  <script src="/bant.js?v=10"></script>
</body>
</html>
